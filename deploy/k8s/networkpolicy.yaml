apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mdb-mcp-gateway
  namespace: mdb-mcp-gateway
spec:
  podSelector:
    matchLabels:
      app: mdb-mcp-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mdb-mcp-gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 27017
        - protocol: TCP
          port: 11434
        - protocol: TCP
          port: 443
