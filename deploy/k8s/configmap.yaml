apiVersion: v1
kind: ConfigMap
metadata:
  name: mdb-mcp-gateway-config
  namespace: mdb-mcp-gateway
data:
  APP_NAME: mdb-mcp-gateway
  ENVIRONMENT: production
  AUTH_MODE: jwks
  JWT_ISSUER: https://example-issuer
  JWT_AUDIENCE: mdb-mcp-gateway
  JWKS_URI: https://example-issuer/.well-known/jwks.json
  EMBEDDING_PROVIDER: ollama
  OLLAMA_MODEL: nomic-embed-text
  OLLAMA_BASE_URL: http://ollama.default.svc.cluster.local:11434
  AZURE_OPENAI_API_VERSION: "2023-05-15"
  # Cloud-provider API keys belong in the Secret (EMBEDDING_API_KEY), not here.
  # The active embedding config can also be managed at runtime from the admin UI.
  ENABLE_METRICS: "true"
  # Trust X-Forwarded-* only from your ingress/LB so client IP (rate limiting) and
  # scheme (Secure cookies) are correct. Set to the proxy's pod/CIDR, never "*" if the
  # gateway can be reached directly. Read natively by uvicorn (--proxy-headers is on).
  FORWARDED_ALLOW_IPS: "10.0.0.0/8"
