replicaCount: 2

image:
  repository: mdb-mcp-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaces:
    - mdb-mcp-gateway
    - ingress-nginx
  dnsNamespace: kube-system
  mongodbPort: 27017
  ollamaPort: 11434
  jwksPort: 443

env:
  APP_NAME: mdb-mcp-gateway
  ENVIRONMENT: production
  AUTH_MODE: jwks
  JWT_ISSUER: https://example-issuer
  JWT_AUDIENCE: mdb-mcp-gateway
  JWKS_URI: https://example-issuer/.well-known/jwks.json
  ENABLE_METRICS: "true"
