<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gateway Admin Login</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="theme-dark">
    <div class="auth-shell theme-dark">
      <div class="auth-card card">
        <div class="auth-brand">
          <div class="brand-chip">
            <svg class="brand-leaf" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 1.6c1.9 3.4 5.6 6.9 5.6 12.1 0 3.3-2.2 5.7-4.8 6.4l-.5 2.3h-.6l-.5-2.3c-2.6-.7-4.8-3.1-4.8-6.4C6.4 8.5 10.1 5 12 1.6z" />
            </svg>
          </div>
          <div>
            <div class="brand-kicker">mdb-mcp-gateway</div>
            <h1 class="brand-title">Admin Login</h1>
          </div>
        </div>
        {% if error %}
          <div class="error-banner">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ ui_path }}/login" class="auth-form">
          <div>
            <label class="field-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              class="field-input"
              placeholder="demo@demo.com"
              autocomplete="username"
            />
          </div>
          <div>
            <label class="field-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              required
              class="field-input"
              autocomplete="current-password"
            />
          </div>
          <button type="submit" class="btn-primary auth-submit">Sign in</button>
        </form>
      </div>
    </div>
  </body>
</html>
