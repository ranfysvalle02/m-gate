name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Pytest (unit, offline)
        # Integration/load tests need a live Atlas Local + Ollama and run in the
        # separate `integration` job below; exclude them from the fast gate.
        run: pytest -q -m "not integration and not load" --cov --cov-report=term-missing --cov-fail-under=82

  integration:
    runs-on: ubuntu-latest
    # The integration tier provisions its OWN Atlas Local container via
    # testcontainers (pinned image, verified search-capable, isolated DB, torn
    # down after) — exactly as it runs locally. The GitHub runner provides the
    # Docker daemon; no service container or manual bootstrap step is needed.
    env:
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: "768"
      INCLUDE_SCORE_DETAILS: "true"
      # Security is always enforced; "disabled" no longer exists. Run the
      # integration tier in the default hs256 mode with a CI-only secret.
      AUTH_MODE: hs256
      JWT_SECRET: ci-integration-jwt-secret
      FUSION_STRATEGY: rank_fusion
      # Turn a missing/unhealthy engine into a HARD FAILURE instead of a silent
      # skip. The whole point of this job is to reproduce the cloud gate; a
      # skipped-green tier just hides real infra breakage until later.
      INTEGRATION_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Fetch pinned python.wasm runtime
        run: python scripts/fetch_python_wasm.py
      - name: Pre-pull the pinned Atlas Local image
        # Keep in lockstep with tests/integration/conftest.py ATLAS_LOCAL_IMAGE
        # and docker-compose.yml; $rankFusion needs 8.1+. Pinned to a patch-level
        # build (not floating :8.3) for deterministic, drift-free runs.
        run: docker pull mongodb/mongodb-atlas-local:8.3.2-20260618T112243Z
      - name: Install and warm Ollama (embeddings provider)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for the daemon, then pull the embedding model.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull nomic-embed-text
      - name: Pytest (integration + load, owned Atlas Local via testcontainers)
        run: pytest -q -m "integration or load"
