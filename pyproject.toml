[project]
name = "mdb-mcp-gateway"
version = "0.2.0"
requires-python = ">=3.12"

[project.scripts]
mdb-gateway-admin = "scripts.admin:main"
mdb-gateway-cache-migrate = "scripts.migrate_cache:main"

[project.optional-dependencies]
guardrails-ml = [
  "presidio-analyzer>=2.2.355",
  "presidio-anonymizer>=2.2.355",
  "spacy>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
ignore_missing_imports = true
pretty = true
# Type-check the application packages. Tests exercise framework internals
# (ASGI scope dicts, FastAPI route introspection) with intentionally dynamic
# access, so they're linted by ruff but not type-gated here.
exclude = "^tests/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests requiring external services",
  "e2e: end-to-end behavior tests",
  "security: authn/authz and guardrail behavior",
  "load: higher concurrency checks",
]
