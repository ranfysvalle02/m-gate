services:
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    container_name: mdb-gateway-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - mongodb_data:/data/db

  weather:
    build:
      context: .
    command: ["uvicorn", "servers.weather.server:app", "--host", "0.0.0.0", "--port", "8101"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8101:8101"

  orders:
    build:
      context: .
    command: ["uvicorn", "servers.orders.server:app", "--host", "0.0.0.0", "--port", "8102"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8102:8102"

  bootstrap:
    build:
      context: .
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      mongodb:
        condition: service_healthy
      weather:
        condition: service_started
      orders:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      ADMIN_UI_ENABLED: "true"
      ADMIN_EMAIL: demo@demo.com
      ADMIN_PASSWORD: demo
      ADMIN_SESSION_SECRET: demo-admin-session-secret
      TENANT_DB_PREFIX: tenant_
      FUSION_STRATEGY: rank_fusion
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  gateway:
    build:
      context: .
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongodb:
        condition: service_healthy
      weather:
        condition: service_started
      orders:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      TENANT_DB_PREFIX: tenant_
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mdb-mcp-gateway
      JWKS_LOCAL_PATH: /app/config/dev-jwks.json
      JWKS_CACHE_TTL_SECONDS: 300
      FUSION_STRATEGY: rank_fusion
      ENABLE_METRICS: "true"
      LOG_JSON: "true"
      REQUEST_MAX_BYTES: 262144
      CORS_ALLOW_ORIGINS: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  mongodb_data:
