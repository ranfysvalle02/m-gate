services:
  secrets-init:
    image: python:3.12-slim
    container_name: mdb-gateway-secrets-init
    entrypoint: ["python", "/secrets-init.py"]
    volumes:
      - ./deploy/secrets/secrets-init.py:/secrets-init.py:ro
      - gateway_secrets:/gateway-secrets
    restart: "no"

  mongodb:
    # 8.3.x (>= 8.1) is required for the $rankFusion hybrid-search stage used by
    # tools/search mode=hybrid. Pinned to a patch-level build (not floating :8.3)
    # so the server stays in lockstep with the Dockerfile's crypt_shared 8.3.2 —
    # client-side QE query analysis needs the lib to match the server.
    image: mongodb/mongodb-atlas-local:8.3.2-20260618T112243Z
    container_name: mdb-gateway-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - mongodb_data:/data/db

  localstack:
    image: localstack/localstack:latest
    container_name: mdb-gateway-localstack
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    environment:
      SERVICES: kms
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "kms", "list-keys"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kms-init:
    image: amazon/aws-cli:latest
    container_name: mdb-gateway-kms-init
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["/kms-init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./deploy/kms/kms-init.sh:/kms-init.sh:ro
      - kms_config:/kms-config
    restart: "no"

  bootstrap:
    build:
      context: .
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kms-init:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      # Embeddings (platform default + tenant fallback). Voyage AI — MongoDB's
      # first-party embedding stack — is AUTO-SELECTED when VOYAGE_API_KEY is set in
      # your local .env (model voyage-3, width auto-detected). While Voyage is active
      # Ollama is never contacted. Per-tenant BYO embeddings stay runtime-scoped via
      # PUT /admin/tenants/{tenant_id}/embedding, so no extra compose wiring is needed.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Offline fallback ONLY — consulted when VOYAGE_API_KEY is empty:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      # To pin a provider explicitly (wins over auto-selection), set EMBEDDING_PROVIDER
      # — e.g. "voyage", or "openai"/"azure_openai"/"gemini" with EMBEDDING_API_KEY_FILE:
      # EMBEDDING_PROVIDER: openai
      # EMBEDDING_API_KEY_FILE: /gateway-secrets/embedding_api_key
      INCLUDE_SCORE_DETAILS: "true"
      # Security is always enforced. The gateway verifies inbound bearer tokens
      # against JWT_SECRET (generated by secrets-init). Mint per-user tokens from
      # the admin console (Users -> Generate token).
      AUTH_MODE: "hs256"
      JWT_SECRET_FILE: /gateway-secrets/jwt_secret
      ADMIN_UI_ENABLED: "true"
      ADMIN_EMAIL: demo@demo.com
      ADMIN_PASSWORD: demo
      ADMIN_SESSION_SECRET_FILE: /gateway-secrets/admin_session_secret
      EMBEDDING_SECRET_FILE: /gateway-secrets/embedding_secret
      TENANT_DB_PREFIX: tenant_
      FUSION_STRATEGY: rank_fusion
      CODE_TOOL_EXECUTION_ENABLED: "true"
      # Tenant embedding API keys are wrapped with per-tenant DEKs, each wrapped
      # by this shared CMK via LocalStack KMS (or AWS KMS in non-local envs).
      QE_ENABLED: "true"
      KMS_PROVIDER: aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_KMS_ENDPOINT: localhost.localstack.cloud:4566
      AWS_KMS_KEY_ARN_FILE: /kms-config/kms_key_id
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # Optional local-key mode (instead of LocalStack):
      # KMS_PROVIDER: local
      # QE_LOCAL_MASTER_KEY_FILE: /kms-config/local-master-key.b64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kms_config:/kms-config:ro
      - gateway_secrets:/gateway-secrets:ro
    restart: "no"

  gateway:
    build:
      context: .
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kms-init:
        condition: service_completed_successfully
      bootstrap:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      # Platform default embeddings for tenants without a per-tenant BYO override.
      # Voyage AI (MongoDB's first-party embeddings) is AUTO-SELECTED when
      # VOYAGE_API_KEY is set in your local .env (model voyage-3, width auto-detected);
      # while Voyage is active the gateway never contacts Ollama. The admin panel
      # (/ui -> Embeddings) can override provider/model/key at runtime.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Offline fallback ONLY — consulted when VOYAGE_API_KEY is empty:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      # To pin a provider explicitly (wins over auto-selection), set EMBEDDING_PROVIDER
      # — e.g. "voyage", or "openai"/"azure_openai"/"gemini" with EMBEDDING_API_KEY_FILE:
      # EMBEDDING_PROVIDER: openai
      # EMBEDDING_API_KEY_FILE: /gateway-secrets/embedding_api_key
      INCLUDE_SCORE_DETAILS: "true"
      # Security is always enforced (no demo/open mode). Inbound bearer tokens are
      # verified against JWT_SECRET (generated by secrets-init and shared with the
      # bootstrap job). The admin console at http://localhost:8000/ui logs in with
      # the ADMIN_EMAIL/ADMIN_PASSWORD below (local-dev defaults only — never ship
      # these to production), and you mint per-user client tokens from there
      # (Users -> Generate token). Bootstrap also seeds three local-only personas
      # so every access tier is demoable out of the box (skipped in production):
      #   demo@demo.com   / demo        -> platform admin (full control)
      #   agent@demo.com  / agent-demo  -> can-invoke power user (discovers + runs)
      #   viewer@demo.com / viewer-demo -> read-only showcase (browse + discover only)
      AUTH_MODE: "hs256"
      JWT_SECRET_FILE: /gateway-secrets/jwt_secret
      ADMIN_UI_ENABLED: "true"
      ADMIN_EMAIL: demo@demo.com
      ADMIN_PASSWORD: demo
      TENANT_DB_PREFIX: tenant_
      # Stamped onto minted bearers as iss/aud and enforced on inbound verify.
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mdb-mcp-gateway
      FUSION_STRATEGY: rank_fusion
      # Local demo defaults to running transport=code tools inside wasm sandbox.
      CODE_TOOL_EXECUTION_ENABLED: "true"
      SANDBOX_DB_BRIDGE_ENABLED: "true"
      # Cross-tool calls (context.tools): code tools can call sibling code tools
      # in the same tenant. Re-authorized against the caller, code-only, bounded.
      SANDBOX_TOOL_BRIDGE_ENABLED: "true"
      # Keep prewarmed CPython-on-WASI workers resident. With pool size 0 every
      # call spawns a throwaway worker that does a full Cranelift compile of the
      # 26MB python.wasm under a tight RLIMIT_CPU -> SIGXCPU / rayon thread-spawn
      # failures under load. A warm pool compiles once at startup (reusing the
      # serialized module cache) and serve-mode workers skip cumulative CPU
      # rlimits, so each call reuses an already-compiled runtime. Global cap is
      # kept at pool size so concurrent demand never queues past warm capacity.
      SANDBOX_POOL_SIZE: "2"
      SANDBOX_MAX_GLOBAL_CONCURRENCY: "2"
      ENABLE_METRICS: "true"
      LOG_JSON: "true"
      REQUEST_MAX_BYTES: 262144
      CORS_ALLOW_ORIGINS: "*"
      FORWARDED_ALLOW_IPS: 127.0.0.1
      ADMIN_SESSION_SECRET_FILE: /gateway-secrets/admin_session_secret
      EMBEDDING_SECRET_FILE: /gateway-secrets/embedding_secret
      # Tenant embedding API keys are wrapped with per-tenant DEKs, each wrapped
      # by this shared CMK via LocalStack KMS (or AWS KMS in non-local envs).
      QE_ENABLED: "true"
      KMS_PROVIDER: aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_KMS_ENDPOINT: localhost.localstack.cloud:4566
      AWS_KMS_KEY_ARN_FILE: /kms-config/kms_key_id
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # Optional local-key mode (instead of LocalStack):
      # KMS_PROVIDER: local
      # QE_LOCAL_MASTER_KEY_FILE: /kms-config/local-master-key.b64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kms_config:/kms-config:ro
      - gateway_secrets:/gateway-secrets:ro
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mdb-gateway-prometheus
    depends_on:
      gateway:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    # Host port is overridable to avoid collisions with other local stacks, e.g.
    # `PROMETHEUS_HOST_PORT=9091 docker compose up`.
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mdb-gateway-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    # Host port is overridable to avoid collisions, e.g. `GRAFANA_HOST_PORT=3001`.
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"

volumes:
  mongodb_data:
  localstack_data:
  kms_config:
  gateway_secrets:
  prometheus_data:
  grafana_data:
