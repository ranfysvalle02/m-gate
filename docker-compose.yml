services:
  mongodb:
    image: mongodb/mongodb-atlas-local:preview
    container_name: mdb-gateway-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - mongodb_data:/data/db

  weather:
    build:
      context: .
    command: ["uvicorn", "servers.weather.server:app", "--host", "0.0.0.0", "--port", "8101"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8101:8101"

  orders:
    build:
      context: .
    command: ["uvicorn", "servers.orders.server:app", "--host", "0.0.0.0", "--port", "8102"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8102:8102"

  bootstrap:
    build:
      context: .
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      mongodb:
        condition: service_healthy
      weather:
        condition: service_started
      orders:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      ADMIN_UI_ENABLED: "true"
      ADMIN_EMAIL: demo@demo.com
      ADMIN_PASSWORD: demo
      ADMIN_SESSION_SECRET: demo-admin-session-secret
      TENANT_DB_PREFIX: tenant_
      FUSION_STRATEGY: rank_fusion
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  gateway:
    build:
      context: .
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mongodb:
        condition: service_healthy
      weather:
        condition: service_started
      orders:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      TENANT_DB_PREFIX: tenant_
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mdb-mcp-gateway
      JWKS_LOCAL_PATH: /app/config/dev-jwks.json
      JWKS_CACHE_TTL_SECONDS: 300
      FUSION_STRATEGY: rank_fusion
      ENABLE_METRICS: "true"
      LOG_JSON: "true"
      REQUEST_MAX_BYTES: 262144
      CORS_ALLOW_ORIGINS: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mdb-gateway-prometheus
    depends_on:
      gateway:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mdb-gateway-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
