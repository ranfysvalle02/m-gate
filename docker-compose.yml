services:
  secrets-init:
    image: python:3.12-slim
    container_name: mdb-gateway-secrets-init
    entrypoint: ["python", "/secrets-init.py"]
    volumes:
      - ./deploy/secrets/secrets-init.py:/secrets-init.py:ro
      - gateway_secrets:/gateway-secrets
    restart: "no"

  mongodb:
    image: mongodb/mongodb-atlas-local:8.0
    container_name: mdb-gateway-mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - mongodb_data:/data/db

  localstack:
    image: localstack/localstack:latest
    container_name: mdb-gateway-localstack
    networks:
      default:
        aliases:
          - localhost.localstack.cloud
    environment:
      SERVICES: kms
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: 1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "awslocal", "kms", "list-keys"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  kms-init:
    image: amazon/aws-cli:latest
    container_name: mdb-gateway-kms-init
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: /bin/sh
    command: ["/kms-init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ./deploy/kms/kms-init.sh:/kms-init.sh:ro
      - kms_config:/kms-config
    restart: "no"

  weather:
    build:
      context: .
    command: ["uvicorn", "servers.weather.server:app", "--host", "0.0.0.0", "--port", "8101"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8101:8101"

  orders:
    build:
      context: .
    command: ["uvicorn", "servers.orders.server:app", "--host", "0.0.0.0", "--port", "8102"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
    ports:
      - "8102:8102"

  bootstrap:
    build:
      context: .
    command: ["python", "-m", "scripts.bootstrap"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kms-init:
        condition: service_completed_successfully
      weather:
        condition: service_started
      orders:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      # Platform default embeddings for bootstrap + tenant fallbacks.
      # BYO embeddings is tenant-scoped at runtime via:
      #   PUT /admin/tenants/{tenant_id}/embedding
      # so no extra compose wiring is required for the default path.
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      # For cloud providers, prefer HTTPS base URLs and mount EMBEDDING_API_KEY_FILE.
      # EMBEDDING_PROVIDER: openai
      # EMBEDDING_API_KEY_FILE: /gateway-secrets/embedding_api_key
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      ADMIN_UI_ENABLED: "true"
      ADMIN_EMAIL: demo@demo.com
      ADMIN_PASSWORD: demo
      ADMIN_SESSION_SECRET_FILE: /gateway-secrets/admin_session_secret
      EMBEDDING_SECRET_FILE: /gateway-secrets/embedding_secret
      TENANT_DB_PREFIX: tenant_
      FUSION_STRATEGY: rank_fusion
      # Tenant embedding API keys are wrapped with per-tenant DEKs, each wrapped
      # by this shared CMK via LocalStack KMS (or AWS KMS in non-local envs).
      QE_ENABLED: "true"
      KMS_PROVIDER: aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_KMS_ENDPOINT: localhost.localstack.cloud:4566
      AWS_KMS_KEY_ARN_FILE: /kms-config/kms_key_id
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # Optional local-key mode (instead of LocalStack):
      # KMS_PROVIDER: local
      # QE_LOCAL_MASTER_KEY_FILE: /kms-config/local-master-key.b64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kms_config:/kms-config:ro
      - gateway_secrets:/gateway-secrets:ro
    restart: "no"

  gateway:
    build:
      context: .
    command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kms-init:
        condition: service_completed_successfully
      weather:
        condition: service_started
      orders:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?directConnection=true
      MONGODB_DB_NAME: mcp_gateway
      # Platform default embeddings for all tenants that have not configured
      # per-tenant BYO embedding settings through the admin API.
      EMBEDDING_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: nomic-embed-text
      OLLAMA_DIMENSIONS: 768
      # For cloud providers, prefer HTTPS base URLs and mount EMBEDDING_API_KEY_FILE.
      # EMBEDDING_PROVIDER: openai
      # EMBEDDING_API_KEY_FILE: /gateway-secrets/embedding_api_key
      INCLUDE_SCORE_DETAILS: "true"
      AUTH_MODE: "disabled"
      TENANT_DB_PREFIX: tenant_
      JWT_ISSUER: http://localhost:8000
      JWT_AUDIENCE: mdb-mcp-gateway
      JWKS_LOCAL_PATH: /app/config/dev-jwks.json
      JWKS_CACHE_TTL_SECONDS: 300
      FUSION_STRATEGY: rank_fusion
      ENABLE_METRICS: "true"
      LOG_JSON: "true"
      REQUEST_MAX_BYTES: 262144
      CORS_ALLOW_ORIGINS: "*"
      FORWARDED_ALLOW_IPS: 127.0.0.1
      ADMIN_SESSION_SECRET_FILE: /gateway-secrets/admin_session_secret
      EMBEDDING_SECRET_FILE: /gateway-secrets/embedding_secret
      # Tenant embedding API keys are wrapped with per-tenant DEKs, each wrapped
      # by this shared CMK via LocalStack KMS (or AWS KMS in non-local envs).
      QE_ENABLED: "true"
      KMS_PROVIDER: aws
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_KMS_ENDPOINT: localhost.localstack.cloud:4566
      AWS_KMS_KEY_ARN_FILE: /kms-config/kms_key_id
      CRYPT_SHARED_LIB_PATH: /opt/mongodb/lib/mongo_crypt_v1.so
      # Optional local-key mode (instead of LocalStack):
      # KMS_PROVIDER: local
      # QE_LOCAL_MASTER_KEY_FILE: /kms-config/local-master-key.b64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - kms_config:/kms-config:ro
      - gateway_secrets:/gateway-secrets:ro
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mdb-gateway-prometheus
    depends_on:
      gateway:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mdb-gateway-grafana
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mongodb_data:
  localstack_data:
  kms_config:
  gateway_secrets:
  prometheus_data:
  grafana_data:
